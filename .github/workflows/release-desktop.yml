name: Release desktop apps

# Tag-driven, and deliberately separate from deploy.yml: the Pages site builds
# from `main` on every push and must not wait on a 10-minute Rust matrix.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      # One broken target shouldn't discard the bundles that did build.
      fail-fast: false
      matrix:
        include:
          # Two separate macOS bundles rather than a universal one: a universal
          # app would need the two uv sidecars lipo'd together, and would double
          # every user's download.
          - os: macos-latest
            target: aarch64-apple-darwin
            args: "--target aarch64-apple-darwin"
          - os: macos-latest
            target: x86_64-apple-darwin
            args: "--target x86_64-apple-darwin"
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            args: ""

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          # macos-latest runners are arm64, so the x86_64 bundle is a cross-compile.
          targets: ${{ matrix.target }}

      # Rust is the long pole here — a cold build is ~8 minutes, a warm one ~2.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - run: npm ci

      # Vendor the uv sidecar for the target being built, and stage the backend
      # source that ships inside the bundle. tauri-action runs the frontend
      # build itself via beforeBuildCommand.
      - run: node scripts/fetch-uv.mjs --triple ${{ matrix.target }}
      - run: node scripts/stage-backend.mjs

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the update manifest. Unrelated to OS code signing — this key
          # is generated by `npm run tauri signer generate` and costs nothing.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "PDFTranslate __VERSION__"
          releaseBody: |
            See the assets below. macOS: `.dmg` (pick the one matching your chip).
            Windows: the `-setup.exe`.

            These builds are **not signed** — signing needs a paid Apple/Microsoft
            certificate. macOS will say the app is damaged until you run:

            ```
            xattr -dr com.apple.quarantine /Applications/PDFTranslate.app
            ```

            Windows will show a SmartScreen warning: **More info → Run anyway**.

            Every build is produced by the public workflow in this repo; SHA-256
            checksums are listed at the end of these notes.
          # Draft, so the asset list can be eyeballed before the updater starts
          # serving latest.json from it.
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true
          args: ${{ matrix.args }}

  # Published separately from the build so one job covers every platform's assets.
  checksums:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Append SHA-256 checksums to the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          mkdir -p assets && cd assets
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern '*' || true
          # Only the files a human downloads. latest.json and the .sig files are
          # the updater's business and it verifies them itself.
          rm -f latest.json *.sig
          [ -n "$(ls -A)" ] || { echo "no assets to checksum"; exit 0; }
          # Written outside this directory, or `sha256sum *` would list itself.
          {
            echo
            echo '### SHA-256'
            echo '```'
            sha256sum * | sed 's/  / /'
            echo '```'
          } > ../notes.md
          cd ..
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body -q .body > current.md
          cat current.md notes.md > combined.md
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file combined.md
